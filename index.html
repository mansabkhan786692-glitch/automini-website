<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoMini</title>

<style>
body {
  margin: 0;
  font-family: Arial;
}

.navbar {
  display: flex;
  justify-content: space-between;
  padding: 20px;
  background: white;
  position: sticky;
  top: 0;
}

.navbar a {
  margin: 0 10px;
  text-decoration: none;
  color: black;
}

.hero {
  text-align: center;
  padding: 100px 20px;
  background: #f5f5f7;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  padding: 40px;
  gap: 20px;
}

.card {
  background: #f5f5f7;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.section {
  padding: 100px 20px;
  text-align: center;
}

html {
  scroll-behavior: smooth;
}
</style>
</head>

<body>

<header class="navbar">
  <h2>AutoMini</h2>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section id="home" class="hero">
  <h1>Precision in Every Detail.</h1>
  <p>Premium collectible car models</p>
  <button onclick="scrollToProducts()">Explore Collection</button>
</section>

<section id="products" class="products">
  <div class="card">
    <h3>Ferrari Model</h3>
    <p>₹2,999</p>
  </div>
  <div class="card">
    <h3>Lamborghini Model</h3>
    <p>₹3,499</p>
  </div>
</section>

<section id="about" class="section">
  <h1>About</h1>
  <p>We bring automotive excellence into miniature form.</p>
</section>

<section id="contact" class="section">
  <h1>Contact</h1>
  <p>Email: automini@email.com</p>
</section>

<script>
function scrollToProducts() {
  document.getElementById("products").scrollIntoView({
    behavior: "smooth"
  });
}
</script>

</body>
</html>
