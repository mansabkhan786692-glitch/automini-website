<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #fff;
  color: #000;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  padding: 20px 60px;
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
}

.navbar a {
  margin: 0 15px;
  text-decoration: none;
  color: #000;
  font-weight: 500;
}

/* Hero */
.hero {
  text-align: center;
  padding: 140px 20px;
  background: #f5f5f7;
}

.hero h1 {
  font-size: 3.5rem;
  margin-bottom: 10px;
}

.hero p {
  color: #555;
}

.hero button {
  padding: 12px 28px;
  border: none;
  background: #0071e3;
  color: white;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 20px;
}

/* Products */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  padding: 80px;
  gap: 30px;
}

.card {
  background: #f5f5f7;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  transition: 0.4s;
}

.card img {
  width: 100%;
  border-radius: 15px;
}

.card:hover {
  transform: translateY(-10px);
}

/* Sections */
.section {
  padding: 120px 20px;
  text-align: center;
}

.section h1 {
  font-size: 2.5rem;
}

.section p {
  color: #555;
  max-width: 600px;
  margin: auto;
}
</style>
<script>
const elements = document.querySelectorAll(".card, .section");

window.addEventListener("scroll", () => {
  elements.forEach(el => {
    const position = el.getBoundingClientRect().top;
    const screenHeight = window.innerHeight;

    if (position < screenHeight - 100) {
      el.style.opacity = 1;
      el.style.transform = "translateY(0)";
    }
  });
});

elements.forEach(el => {
  el.style.opacity = 0;
  el.style.transform = "translateY(40px)";
  el.style.transition = "0.6s";
});
</script>
